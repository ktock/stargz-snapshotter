apiVersion: v1
kind: Service
metadata:
  name: ipfs-bootstrap-llb
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
  labels:
    app: ipfs-bootstrap-llb
spec:
  type: LoadBalancer
  ports:
    - name: id
      targetPort: id
      port: 8000
    - name: swarm
      targetPort: swarm
      port: 4001
  selector:
    app: ipfs-bootstrap
